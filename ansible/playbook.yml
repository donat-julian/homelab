---
- name: Ubuntu Server Grundkonfiguration
  hosts: ubuntu_server
  become: yes

  tasks:
    - name: System aktualisieren
      apt:
        update_cache: yes
        upgrade: yes

    - name: Nginx installieren
      apt:
        name: nginx
        state: present

    # Regeln vor dem Aktivieren setzen, sonst sperrt sich Ansible selbst aus
    - name: SSH erlauben
      ufw:
        rule: allow
        name: OpenSSH

    - name: HTTP erlauben
      ufw:
        rule: allow
        name: "Nginx HTTP"

    - name: Eingehenden Traffic standardmäßig blockieren
      ufw:
        direction: incoming
        policy: deny

    - name: Ausgehenden Traffic standardmäßig erlauben
      ufw:
        direction: outgoing
        policy: allow

    - name: UFW aktivieren
      ufw:
        state: enabled
